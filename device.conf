# The phone, for the common repository's device tooling (the same fields as hakios-mt6768's device.conf).
device a32
	title	Samsung Galaxy A32 4G (SM-A325F)
	vendor	Samsung
	soc	mt6769t
	status boot works mtkloader in boot in front of Android, 4 cores, returns to Android after each run
	status storage works, read only the system image off the eMMC (emmc_root=1), 4 GiB xnusys
	status display works 1080x2400 command-mode DSI, iOS at scale 3 (fbscale=3); watcher + DSI busy check
	status touch works STM FTS5CU56A on I2C6 0x49, bit-banged GPIO89/90, GPIO4 + VCAMA2 rails (touchscreen=3)
	status buttons works power (PMIC TOPSTATUS bit 1) and volume up (keypad) / down (PMIC homekey) (buttons=2)
	status gpu partial Mali-G52 MC2 powered and tested, RedwoodMali running, Mesa panfrost draws (2 job chains); blit/readback stalls and GL=1 crashes backboardd, so CoreAnimation stays software
	status cpu works 4 cores, A75 at 1999 MHz and A55 at 1699 MHz (mtk_cpufreq=3)
	status battery works MT6358 BATADC voltage estimate and CHRDET (battery=2); temperature/current placeholder
	status sensors partial SCP sensor hub runs and the accelerometer streams (scp_step=6); rotation needs the user-space feed
	status wifi missing
	status bluetooth missing
	status audio missing
	status camera missing
	status haptic missing
	status cellular missing
